# busybox httpd auto-detects /cgi-bin/ as the CGI directory, so no H: line.
#
# The dashboard is served by cgi-bin/web.sh as text/xml. Two directives are
# needed because busybox httpd has no defaults for either:
#
#   I:index.xml        without it, a request for / falls through to a directory
#                      listing, which is not what an entry point should look like
#   .xml:text/xml      without it, the static index is answered with no
#                      Content-Type at all and each browser guesses differently
#
# Two traps, both hit and verified in busybox 1.36:
#
#   * The mime pattern must be `.xml:...`, NOT `*.xml:...`. busybox parses a
#     leading asterisk line as an alias and then answers 404 for the directory.
#   * I: must name a real file, never a CGI path. `I:cgi-bin/web.sh` looks like
#     it would make the panel the entry point; instead busybox serves that path
#     as a plain file, so / would hand out the script's own source.
I:index.xml
.xml:text/xml
.css:text/css
