# busybox httpd auto-detects /cgi-bin/ as the CGI directory, so no H: line.
#
# The dashboard is served by cgi-bin/web.sh as text/xml, and the directory index
# is index.xml rather than index.html. Two directives are needed because busybox
# httpd has no defaults for either:
#
#   I:index.xml        without it, a request for / falls through to a directory
#                      listing, which is not what an entry point should look like
#   .xml:text/xml      without it, the static index is answered with no
#                      Content-Type at all and each browser guesses differently
#
# The mime pattern must be written as `.xml:...`, NOT `*.xml:...`: busybox
# parses a leading `*` line as an alias and then answers 404 for the whole
# directory. Verified in busybox 1.36 — `*.xml` breaks `/`, `.xml` works.
I:index.xml
.xml:text/xml
.css:text/css
