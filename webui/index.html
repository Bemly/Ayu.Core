<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayu Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gate" class="gate">
  <form class="gate-box" id="gate-form">
    <h1>Ayu Dashboard</h1>
    <p class="muted">输入 webhook 密钥（WEBHOOK_SECRET）以访问控制台</p>
    <input id="token" type="password" placeholder="token" autocomplete="current-password">
    <button type="submit">进入</button>
    <p class="err" id="gate-err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="header">
    <div class="brand">Ayu <span class="muted">Dashboard</span></div>
    <div class="header-right">
      <span id="status-dot" class="dot"></span>
      <span id="status-text" class="muted">连接中</span>
      <button id="refresh" class="ghost" title="刷新">刷新</button>
      <button id="logout" class="ghost" title="清除密钥">退出</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="overview">概览</button>
    <button class="tab" data-view="sync">同步</button>
    <button class="tab" data-view="logs">日志</button>
    <button class="tab" data-view="config">设置</button>
  </nav>

  <main>
    <section id="view-overview" class="view">
      <div class="grid" id="stat-grid"></div>
      <div class="card">
        <div class="card-head">存储</div>
        <table class="kv" id="storage-table"></table>
      </div>
    </section>

    <section id="view-sync" class="view hidden">
      <div class="card">
        <div class="card-head">转发映射 <span class="muted" id="sync-count"></span></div>
        <table class="list" id="sync-table">
          <thead><tr><th>来源</th><th>目标</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="view-logs" class="view hidden">
      <div class="card">
        <div class="card-head">
          日志
          <span class="log-controls">
            <select id="log-which">
              <option value="bot">bot.log</option>
              <option value="error">error.log</option>
              <option value="cron">cron.log</option>
            </select>
            <label class="muted"><input type="checkbox" id="log-follow" checked> 自动刷新</label>
          </span>
        </div>
        <pre id="log-body" class="log"></pre>
      </div>
    </section>

    <section id="view-config" class="view hidden">
      <div class="card">
        <div class="card-head">运行配置 <span class="muted">（密钥已隐藏）</span></div>
        <table class="kv" id="config-table"></table>
      </div>
      <div class="card">
        <div class="card-head">维护</div>
        <table class="kv" id="maint-table"></table>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
